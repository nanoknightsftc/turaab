<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Turaab Ali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E6391B;
            --red-dark: #c42f14;
            --red-faint: rgba(230,57,27,0.1);
            --red-border: rgba(230,57,27,0.25);
            --dark: #231F20;
            --dark-2: #2b2728;
            --dark-3: #332e2f;
            --text: #f0ebe9;
            --muted: #9e9794;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── NAV (TOP) ── */
        nav {
            background: var(--dark-2);
            padding: 0 24px;
            position: sticky;
            top: 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
            border-bottom: 1px solid var(--border);
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 15px 14px;
            font-weight: 600;
            font-size: 0.84em;
            letter-spacing: 0.01em;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
        }

        nav a:hover, nav a.active {
            color: var(--red);
            border-bottom-color: var(--red);
        }

        /* ── HEADER ── */
        header {
            background: var(--red);
            color: white;
            padding: 80px 20px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 40%, rgba(255,255,255,0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(0,0,0,0.2) 0%, transparent 50%);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: rgba(0,0,0,0.2);
        }

        .header-inner { position: relative; z-index: 1; }

        .breadcrumb {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 0.75em;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        .breadcrumb a { color: rgba(255,255,255,0.7); text-decoration: none; }
        .breadcrumb a:hover { color: white; }

        header h1 {
            font-size: clamp(2em, 5vw, 3.2em);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            animation: fadeInDown 0.7s ease both;
            color: #fff;
        }

        header p {
            font-size: 1.05em;
            color: rgba(255,255,255,0.88);
            font-weight: 400;
            animation: fadeInUp 0.7s ease 0.15s both;
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 28px 60px;
        }

        /* ── SECTION ── */
        section {
            background: var(--dark-2);
            margin: 24px 0;
            padding: 48px 52px;
            border-radius: 14px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.4);
            animation: fadeIn 0.7s ease both;
            border: 1px solid var(--border);
        }

        h2 {
            color: var(--red);
            font-size: 1.75em;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: -0.025em;
        }

        h2 span {
            display: block;
            width: 40px;
            height: 4px;
            background: var(--red);
            border-radius: 2px;
            margin-top: 10px;
            opacity: 0.55;
        }

        /* ── FORM ── */
        form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-weight: 600;
            font-size: 0.88em;
            color: var(--text);
            letter-spacing: 0.01em;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 0.97em;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: var(--dark-3);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
        }

        input:focus,
        textarea:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(230,57,27,0.12);
            background: var(--dark-3);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button[type="submit"] {
            background: var(--red);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 0.97em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            letter-spacing: 0.01em;
        }

        button[type="submit"]:hover {
            background: var(--red-dark);
            transform: translateY(-2px);
        }

        /* ── FOOTER ── */
        footer {
            background: var(--dark-2);
            color: var(--muted);
            text-align: center;
            padding: 28px 30px;
            font-size: 0.87em;
            font-weight: 400;
            letter-spacing: 0.01em;
            border-top: 1px solid var(--border);
        }

        footer b { color: var(--red); font-weight: 600; }

        /* ── ANIMATIONS ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            section { padding: 28px 20px; }
            nav a { padding: 12px 10px; font-size: 0.8em; }
            .container { padding: 20px 16px 48px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">Home</a>
        <a href="/pc-building/">PC Building</a>
        <a href="/problem-solving/">Problem Solving</a>
        <a href="/robotics/">Robotics</a>
        <a href="/technical/">Technical</a>
        <a href="/troubleshooting/">Troubleshooting</a>
        <a href="/photo-video/">Photography & Videography</a>
        <a href="/contact-me/" class="active">Contact Me</a>
    </nav>

    <header>
        <div class="header-inner">
            <div class="breadcrumb"><a href="/">Turaab Ali</a> / Contact</div>
            <h1>Contact Me</h1>
            <p>Let's work together on your next project</p>
        </div>
    </header>

    <div class="container">
        <section>
            <h2>Get in Touch <span></span></h2>
            <form action="https://formspree.io/f/mzdznwen" method="POST">

                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="How can I help you?" required></textarea>
                </div>

                <input type="hidden" name="_subject" value="New Contact Form Message">
                <input type="hidden" name="_template" value="table">
                <input type="text" name="_gotcha" style="display:none">

                <button type="submit">Send Message</button>

            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 <b>Turaab Ali</b> &nbsp;·&nbsp; All rights reserved.</p>
    </footer>

</body>
</html>
