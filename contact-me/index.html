<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Turaab Ali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #764ba2;
            --purple-light: #667eea;
            --purple-faint: #f3eefa;
            --accent: #764ba2;
            --text: #1a1a1a;
            --muted: #555;
            --bg: #f5f5f5;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HEADER ── */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 20px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
        }

        .header-inner { position: relative; z-index: 1; }

        .breadcrumb {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 0.75em;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        .breadcrumb a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
        }

        .breadcrumb a:hover { color: white; }

        header h1 {
            font-size: clamp(2em, 5vw, 3.2em);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            animation: fadeInDown 0.7s ease both;
        }

        header p {
            font-size: 1.05em;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
            animation: fadeInUp 0.7s ease 0.15s both;
        }

        /* ── NAV ── */
        nav {
            background: var(--white);
            padding: 0 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 1px 12px rgba(91,33,182,0.1);
            z-index: 100;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }

        nav a {
            color: #764ba2;
            text-decoration: none;
            padding: 16px 14px;
            font-weight: 600;
            font-size: 0.85em;
            letter-spacing: 0.01em;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        nav a:hover, nav a.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 20px 60px;
        }

        /* ── SECTION ── */
        section {
            background: var(--white);
            margin: 30px 0;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(91,33,182,0.07);
            animation: fadeIn 0.7s ease both;
        }

        h2 {
            color: var(--purple);
            font-size: 1.75em;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        h2 span {
            display: block;
            width: 40px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 10px;
        }

        /* ── FORM ── */
        form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-weight: 600;
            font-size: 0.88em;
            color: var(--text);
            letter-spacing: 0.01em;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid #ddd6f5;
            font-size: 0.97em;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: var(--bg);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aaa;
        }

        input:focus,
        textarea:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(118,75,162,0.1);
            background: var(--white);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 0.97em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            letter-spacing: 0.01em;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* ── FOOTER ── */
        footer {
            background: #1a1a1a;
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 30px;
            font-size: 0.88em;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            section { padding: 28px 20px; }
            nav a { padding: 12px 10px; font-size: 0.82em; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="breadcrumb"><a href="/">Turaab Ali</a> / Contact</div>
            <h1>Contact Me</h1>
            <p>Let's work together on your next project</p>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/pc-building/">PC Building</a>
        <a href="/problem-solving/">Problem Solving</a>
        <a href="/robotics/">Robotics</a>
        <a href="/technical/">Technical</a>
        <a href="/troubleshooting/">Troubleshooting</a>
        <a href="/photo-video/">Photography & Videography</a>
        <a href="/contact-me/" class="active">Contact Me</a>
    </nav>

    <div class="container">
        <section>
            <h2>Get in Touch <span></span></h2>
            <form action="https://formspree.io/f/mzdznwen" method="POST">

                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="How can I help you?" required></textarea>
                </div>

                <input type="hidden" name="_subject" value="New Contact Form Message">
                <input type="hidden" name="_template" value="table">
                <input type="text" name="_gotcha" style="display:none">

                <button type="submit">Send Message</button>

            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Turaab Ali. All rights reserved.</p>
    </footer>

</body>
</html>
