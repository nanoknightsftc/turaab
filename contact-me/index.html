<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Turaab Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════
   ROOT & GLOBAL
════════════════════════════════════════ */
:root {
  --black: #050505;
  --red:   #E6391B;
  --red2:  #ff4422;
  --green: #00ff88;
  --text:  #c8c3bd;
  --dim:   #3a3530;
  --dim2:  #524d47;
  --mono:  'Share Tech Mono', monospace;
  --sans:  'Space Grotesk', sans-serif;
  --disp:  'Bebas Neue', sans-serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--black);
  color: var(--text);
  overflow-x: hidden;
  cursor: none;
  -webkit-font-smoothing: antialiased;
}

/* ── ATMOSPHERE ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(230,57,27,0.18) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 20%, transparent 85%);
}

body::after {
  content: '';
  position: fixed; inset: 0; z-index: 1;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  pointer-events: none;
}

#globe-glow {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70vw 60vh at 15% 20%, rgba(230,57,27,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50vw 40vh at 85% 80%, rgba(230,57,27,0.05) 0%, transparent 55%);
  animation: globeMove 14s ease-in-out infinite alternate;
}

@keyframes globeMove {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(3vw,-4vh) scale(1.04); }
  100% { transform: translate(-2vw,3vh) scale(0.97); }
}

#grain {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025;
}

/* ── CURSOR ── */
#cur      { position:fixed; width:4px; height:4px; background:var(--red); pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
#cur-ring { position:fixed; width:26px; height:26px; border:1px solid var(--red); pointer-events:none; z-index:9998; transform:translate(-50%,-50%); opacity:0.45; transition: width .3s, height .3s, opacity .3s; }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 500;
  background: rgba(5,5,5,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(230,57,27,0.15);
  padding: 0 48px;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
}

.nav-logo { font-family: var(--mono); font-size: 0.75em; color: var(--red); letter-spacing: 0.1em; }
.nav-logo span { color: var(--dim2); }
.nav-links { display:flex; }
.nav-links a {
  color: var(--dim2); text-decoration: none; font-family: var(--mono); font-size: 0.65em;
  letter-spacing: 0.12em; padding: 0 18px; height: 52px; display: flex; align-items: center;
  border-left: 1px solid rgba(255,255,255,0.04); transition: color .2s;
}
.nav-links a.active { color: #fff; border-bottom: 1px solid var(--red); }
.nav-links a:hover { color: #fff; }

/* ── HERO ── */
#hero-min {
  position: relative; z-index: 3;
  padding: 120px 10vw 40px;
  text-align: center;
}

.hero-eyebrow {
  font-family: var(--mono); font-size: 0.72em; color: var(--red);
  letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px;
  opacity: 0; animation: fadeUp .6s ease .15s forwards;
}

.hero-name {
  font-family: var(--disp); font-size: clamp(4em, 10vw, 8em);
  letter-spacing: 0.05em; line-height: 0.9; color: #fff;
  opacity: 0; animation: fadeUp .9s cubic-bezier(0.16,1,0.3,1) .3s forwards;
}

/* ── CENTERED LAYOUT ── */
main {
  position: relative; z-index: 3;
  max-width: 1280px; margin: 0 auto;
  padding: 0 10vw 120px;
  display: flex;
  flex-direction: column;
  align-items: center; /* Centers the .sec container */
}

.sec {
  padding: 60px 0;
  position: relative;
  width: 100%;
  max-width: 600px; /* Constrains the form width while centered */
  opacity: 0; transform: translateY(36px);
  transition: opacity .8s cubic-bezier(0.16,1,0.3,1), transform .8s cubic-bezier(0.16,1,0.3,1);
}
.sec.vis { opacity:1; transform:none; }

/* Repositioned vertical accent line for centered layout */
.sec::before {
  content: ''; position: absolute; left: -40px; top: 0; height: 100%; width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(230,57,27,0.2) 30%, rgba(230,57,27,0.2) 70%, transparent);
}

.sec-hd { 
  display: flex; 
  align-items: baseline; 
  gap: 20px; 
  margin-bottom: 40px;
  justify-content: center; /* Centers the title and number */
}
.sec-num { font-family: var(--mono); font-size: 0.65em; color: var(--red); letter-spacing: 0.12em; opacity: 0.7; }
.sec-title { font-family: var(--disp); font-size: 2.5em; color: #fff; letter-spacing: 0.07em; }

/* ── FORM ── */
form { 
  display: grid; 
  gap: 32px; 
  width: 100%; 
}

.field { display: flex; flex-direction: column; gap: 12px; }

label {
  font-family: var(--mono); font-size: 0.65em; color: var(--red);
  letter-spacing: 0.15em; text-transform: uppercase;
}

input, textarea {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 16px; font-family: var(--mono); font-size: 0.85em;
  color: #fff; transition: all 0.3s ease;
  outline: none;
}

input:focus, textarea:focus {
  background: rgba(230,57,27,0.04);
  border-color: var(--red);
  box-shadow: 0 0 20px rgba(230,57,27,0.1);
}

textarea { min-height: 160px; resize: none; }

.btn-submit {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  text-decoration: none; font-family: var(--mono); font-size: 0.72em;
  color: var(--red); letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid rgba(230,57,27,0.4); padding: 18px 32px;
  cursor: none; transition: all .3s; position: relative; overflow: hidden;
  background: transparent; 
  width: 100%; /* Full width button for centered aesthetic */
}

.btn-submit::after {
  content: ''; position: absolute; inset: 0; background: rgba(230,57,27,0.08);
  transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(0.16,1,0.3,1);
}

.btn-submit:hover { color: #fff; border-color: var(--red); }
.btn-submit:hover::after { transform: scaleX(1); }
.btn-submit span { position: relative; z-index: 1; }

/* ── FOOTER ── */
footer {
  position: relative; z-index: 3; border-top: 1px solid rgba(255,255,255,0.05);
  padding: 28px 10vw; display: flex; justify-content: space-between; align-items: center;
}
.foot-logo { font-family: var(--disp); font-size: 1.3em; color: var(--dim2); }
.foot-copy { font-family: var(--mono); font-size: 0.6em; color: var(--dim); }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }
#pcv { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.25; }

@media (max-width:640px) {
  .sec::before { display: none; }
  main { padding: 0 6vw 80px; }
  #hero-min { padding: 100px 6vw 40px; }
}
</style>
</head>
<body>

<div id="globe-glow"></div>
<div id="grain"></div>
<canvas id="pcv"></canvas>

<div id="cur"></div>
<div id="cur-ring"></div>

<nav>
  <div class="nav-logo">TURAAB_ALI <span>// v2.0</span></div>
  <div class="nav-links">
        <a href="/">Home</a>
        <a href="/pc-building/">PC Building</a>
        <a href="/problem-solving/">Problem Solving</a>
        <a href="/robotics/">Robotics</a>
        <a href="/technical/">Technical</a>
        <a href="/troubleshooting/">Troubleshooting</a>
        <a href="/photo-video/">Photography & Videography</a>
        <a href="/contact-me/" class="active">Contact Me</a>
  </div>
</nav>

<header id="hero-min">
    <div class="hero-eyebrow">TURAAB ALI / INITIATE CONTACT</div>
    <h1 class="hero-name">CONTACT<span style="color:var(--red); opacity:0.7;">//</span>ME</h1>
</header>

<main>
    <section class="sec" id="contact-form">
        <div class="sec-hd">
            <span class="sec-num">[ 01 ]</span>
            <h2 class="sec-title">GET IN TOUCH</h2>
        </div>
        
        <form action="https://formspree.io/f/mzdznwen" method="POST">
            <div class="field">
                <label for="name">ID_NAME</label>
                <input type="text" id="name" name="name" placeholder="Enter your name..." required>
            </div>

            <div class="field">
                <label for="email">ADDR_EMAIL</label>
                <input type="email" id="email" name="email" placeholder="Enter your email..." required>
            </div>

            <div class="field">
                <label for="message">MSG_CONTENT</label>
                <textarea id="message" name="message" placeholder="How can I help you today?" required></textarea>
            </div>

            <input type="hidden" name="_subject" value="New Contact Form Message">
            <input type="hidden" name="_template" value="table">
            <input type="text" name="_gotcha" style="display:none">

            <button type="submit" class="btn-submit">
                <span>EXECUTE SEND</span> <span>→</span>
            </button>
        </form>
    </section>
</main>

<footer>
  <div class="foot-logo">TURAAB_ALI</div>
  <div class="foot-copy">&copy; 2026 <b>Turaab Ali</b> &nbsp;·&nbsp; All rights reserved.</div>
</footer>

<script>
/* ── REUSED JS LOGIC ── */
const cur=document.getElementById('cur'), ring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
(function a(){ rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(a); })();
document.querySelectorAll('a,button,input,textarea').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ ring.style.width='48px'; ring.style.height='48px'; ring.style.opacity='0.2'; });
  el.addEventListener('mouseleave',()=>{ ring.style.width='26px'; ring.style.height='26px'; ring.style.opacity='0.45'; });
});

const cv=document.getElementById('pcv'), cx=cv.getContext('2d');
let W,H,pts=[];
function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
class P{
  constructor(){ this.reset(); }
  reset(){ this.x=Math.random()*W; this.y=Math.random()*H; this.sz=Math.random()*1.2+0.3; this.vx=(Math.random()-.5)*.35; this.vy=(Math.random()-.5)*.35; this.op=Math.random()*.5+.1; this.life=Math.random()*250+80; this.age=0; }
  tick(){ this.x+=this.vx; this.y+=this.vy; this.age++; if(this.age>this.life||this.x<0||this.x>W||this.y<0||this.y>H) this.reset(); }
  draw(){ const f=this.age<30?this.age/30:(this.age>this.life-30?(this.life-this.age)/30:1); cx.globalAlpha=this.op*f; cx.fillStyle=Math.random()>.88?'#E6391B':'#fff'; cx.beginPath(); cx.arc(this.x,this.y,this.sz,0,Math.PI*2); cx.fill(); }
}
function loop(){ cx.clearRect(0,0,W,H); pts.forEach(p=>{p.tick();p.draw();}); requestAnimationFrame(loop); }
resize();
for(let i=0;i<100;i++) pts.push(new P());
loop();
window.addEventListener('resize', resize);

const obs=new IntersectionObserver(en=>en.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('vis'); }),{threshold:0.1});
document.querySelectorAll('.sec').forEach(s=>obs.observe(s));
</script>
</body>
</html>
